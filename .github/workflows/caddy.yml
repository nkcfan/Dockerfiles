name: Caddy image

on:
  workflow_call:
    inputs:
      reference_image:
        description: Optional immutable original image for migration-equivalence checks
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      reference_image:
        description: Optional immutable original image for migration-equivalence checks
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: caddy-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Caddy test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Test and generate source-only build
        run: |
          python3 -m unittest discover -s caddy/tests -v
          python3 caddy/build.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build local base images and both Dynu images with Bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: .
          files: caddy/.build/docker-bake.json
          load: true
          targets: |
            caddy
            reference
          set: |
            caddy.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            reference.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            upstream-*.cache-from=type=gha,scope=caddy-source-${{ matrix.arch }}
            reference-builder.cache-from=type=gha,scope=caddy-reference-${{ matrix.arch }}
            caddy.cache-from=type=gha,scope=caddy-source-${{ matrix.arch }}
            caddy.cache-to=type=gha,mode=max,scope=caddy-source-${{ matrix.arch }}
            reference.cache-from=type=gha,scope=caddy-reference-${{ matrix.arch }}
            reference.cache-to=type=gha,mode=max,scope=caddy-reference-${{ matrix.arch }}
      - name: Verify runtime equivalence, Dynu, HTTP, HTTPS, and persistence
        run: python3 caddy/test_image.py
      - name: Verify against the original published image
        if: inputs.reference_image != ''
        env:
          REFERENCE_IMAGE: ${{ inputs.reference_image }}
        run: |
          [[ "$REFERENCE_IMAGE" =~ ^ghcr\.io/nkcfan/caddy@sha256:[0-9a-f]{64}$ ]] ||
            { echo "::error::Reference must be an immutable digest of ghcr.io/nkcfan/caddy"; exit 1; }
          docker pull "$REFERENCE_IMAGE"
          python3 caddy/test_image.py --baseline "$REFERENCE_IMAGE"
          printf 'Original-image equivalence passed (%s): `%s`\n' \
            '${{ matrix.arch }}' "$REFERENCE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Export the tested image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: docker save caddy-source:test | gzip > "$RUNNER_TEMP/caddy-${{ matrix.arch }}.tar.gz"
      - name: Upload the tested image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: caddy-${{ matrix.arch }}
          path: ${{ runner.temp }}/caddy-${{ matrix.arch }}.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Caddy publish tested images
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Read pinned versions
        run: python3 caddy/build.py
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: caddy-*
          path: ${{ runner.temp }}/caddy-images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested payloads and multi-platform tags
        env:
          OWNER: ${{ github.repository_owner }}
          ARTIFACT_DIR: ${{ runner.temp }}/caddy-images
        run: |
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/caddy"
          version=$(python3 -c 'import json; print(json.load(open("caddy/.build/versions.json"))["caddy"].removeprefix("v"))')
          tag="$version-$GITHUB_SHA"
          unique="$tag-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for arch in amd64 arm64; do
            gzip -dc "$ARTIFACT_DIR/caddy-$arch.tar.gz" | docker load
            docker tag caddy-source:test "$image:$unique-$arch"
            docker push "$image:$unique-$arch"
            docker image rm caddy-source:test
          done
          docker buildx imagetools create \
            --tag "$image:$unique" \
            --tag "$image:$tag" \
            --tag "$image:latest" \
            "$image:$unique-amd64" "$image:$unique-arm64"
          docker buildx imagetools inspect "$image:$unique" >> "$GITHUB_STEP_SUMMARY"
